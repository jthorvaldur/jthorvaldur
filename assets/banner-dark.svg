<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="15%" stop-color="#7aa2f7" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#bb9af7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g opacity="0.04" stroke="#7aa2f7" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
    <line x1="1000" y1="0" x2="1000" y2="200"/>
  </g>
  <!-- accent line -->
  <rect x="0" y="196" width="1200" height="4" fill="url(#line)"/>
  <!-- conformal-inspired curve -->
  <path d="M100,140 Q300,60 500,100 T900,80 Q1000,70 1100,90" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.15"/>
  <path d="M100,150 Q350,80 550,110 T950,85 Q1050,75 1100,95" fill="none" stroke="url(#accent)" stroke-width="0.8" opacity="0.08"/>
  <!-- text -->
  <text x="80" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="300" fill="#e8e8f4" letter-spacing="-0.5">
    Joel Thorarinson
  </text>
  <text x="80" y="125" font-family="ui-monospace, monospace" font-size="13" fill="#7aa2f7" letter-spacing="2" opacity="0.7">
    PHYSICS  &#x2022;  QUANT FINANCE  &#x2022;  AI INFRASTRUCTURE  &#x2022;  LEGAL ANALYTICS
  </text>
</svg>
